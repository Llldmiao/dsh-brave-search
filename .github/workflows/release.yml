name: Release

# Publishes dsh-plugin-brave-search to npm when a v* tag is pushed.
#
# One-time setup (repository owner):
#   Create a granular access token at
#   https://www.npmjs.com/settings/llldmiao/tokens with read and write
#   permission for packages, "bypass 2FA" enabled, and allowed to publish
#   dsh-plugin-brave-search. Store it as the repository secret NPM_TOKEN.
#
# Release flow:
#   npm version patch --no-git-tag-version   # or edit package.json by hand
#   git commit -am "chore(release): x.y.z"
#   git tag "vx.y.z"
#   git push --follow-tags
#   -> this workflow checks the tag against package.json and publishes.
#
# The tag may be pushed for a version that is already on npm (for example when
# a release was published by hand); the publish step then succeeds without
# uploading, and the GitHub release is still created.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} does not match package.json version ${version}"
            exit 1
          fi
          echo "Publishing ${version} from tag ${tag}"

      - name: Install the DSH schema validators
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh-tools

      - name: Syntax check
        run: node --check index.js

      - name: Test before publishing
        run: node test/verify.mjs

      - name: Inspect the tarball
        run: npm pack --dry-run

      # A version can already be on npm when it was published by hand (as 1.0.0
      # and 1.0.1 were) or when a tag is re-pushed. npm rejects a second upload
      # with E403, so ask the registry first and only upload a missing version.
      - name: Publish
        id: publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-plugin-brave-search@${version}" version >/dev/null 2>&1; then
            echo "dsh-plugin-brave-search@${version} is already on npm; skipping the upload"
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          npm publish --access public --provenance
          echo "published=true" >> "${GITHUB_OUTPUT}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
